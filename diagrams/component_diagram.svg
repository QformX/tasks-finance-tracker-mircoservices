<svg viewBox="0 0 1060 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#333"/></marker>
    <marker id="ah2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#888"/></marker>
  </defs>
  <!-- Client -->
  <rect x="280" y="2" width="500" height="32" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="530" y="23" text-anchor="middle" font-size="14" font-weight="600">Tauri Desktop Client (React + TypeScript)</text>
  <line x1="530" y1="34" x2="530" y2="52" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- Gateway -->
  <rect x="40" y="55" width="980" height="52" rx="8" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="52" y="70" font-size="11" fill="#777" font-weight="600">API Gateway (Nginx :80)</text>
  <rect x="60" y="76" width="220" height="24" rx="4" fill="#1a1a1a"/><text x="170" y="93" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">/auth/*</text>
  <rect x="295" y="76" width="220" height="24" rx="4" fill="#1a1a1a"/><text x="405" y="93" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">/api/*</text>
  <rect x="530" y="76" width="220" height="24" rx="4" fill="#1a1a1a"/><text x="640" y="93" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">/stats/*</text>
  <rect x="765" y="76" width="220" height="24" rx="4" fill="#1a1a1a"/><text x="875" y="93" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">/ai/*</text>
  <!-- Arrows: Gateway → Services -->
  <line x1="170" y1="100" x2="170" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="405" y1="100" x2="405" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="640" y1="100" x2="640" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="875" y1="100" x2="875" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- Services -->
  <rect x="40" y="135" width="980" height="62" rx="8" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="52" y="150" font-size="11" fill="#777" font-weight="600">Микросервисы (FastAPI + ASGI)</text>
  <rect x="60" y="156" width="220" height="36" rx="6" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <text x="170" y="172" text-anchor="middle" font-size="13" font-weight="600">Users Service</text>
  <text x="170" y="186" text-anchor="middle" font-size="11" fill="#666">JWT, bcrypt</text>
  <rect x="295" y="156" width="220" height="36" rx="6" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <text x="405" y="172" text-anchor="middle" font-size="13" font-weight="600">Core Service</text>
  <text x="405" y="186" text-anchor="middle" font-size="11" fill="#666">Tasks, Purchases, Categories</text>
  <rect x="530" y="156" width="220" height="36" rx="6" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <text x="640" y="172" text-anchor="middle" font-size="13" font-weight="600">Analytics Service</text>
  <text x="640" y="186" text-anchor="middle" font-size="11" fill="#666">Event Sourcing, OLAP</text>
  <rect x="765" y="156" width="220" height="36" rx="6" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <text x="875" y="172" text-anchor="middle" font-size="13" font-weight="600">AI Service</text>
  <text x="875" y="186" text-anchor="middle" font-size="11" fill="#666">LLM Agent, ReAct</text>
  <!-- Arrows: Services → DBs -->
  <line x1="170" y1="192" x2="170" y2="352" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="405" y1="192" x2="405" y2="352" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="640" y1="192" x2="640" y2="352" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="875" y1="192" x2="875" y2="352" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <!-- Redis (from Core) -->
  <line x1="440" y1="192" x2="510" y2="222" stroke="#888" stroke-width="1.2" marker-end="url(#ah2)"/>
  <rect x="480" y="218" width="76" height="28" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="518" y="237" text-anchor="middle" font-size="12" font-weight="600">Redis</text>
  <text x="518" y="248" text-anchor="middle" font-size="9" fill="#888">Cache</text>
  <!-- Brokers -->
  <rect x="40" y="260" width="470" height="72" rx="8" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="52" y="276" font-size="11" fill="#777" font-weight="600">Брокеры сообщений</text>
  <rect x="60" y="284" width="210" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="165" y="302" text-anchor="middle" font-size="12" font-weight="600">RabbitMQ #1</text>
  <text x="165" y="316" text-anchor="middle" font-size="10" fill="#666">Доменные события (EDA)</text>
  <rect x="285" y="284" width="210" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="390" y="302" text-anchor="middle" font-size="12" font-weight="600">RabbitMQ #2</text>
  <text x="390" y="316" text-anchor="middle" font-size="10" fill="#666">RPC: AI ↔ Core</text>
  <!-- Broker connections -->
  <line x1="170" y1="192" x2="165" y2="284" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="640" y1="192" x2="165" y2="284" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="875" y1="192" x2="390" y2="284" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="405" y1="192" x2="390" y2="284" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Databases -->
  <rect x="40" y="350" width="980" height="62" rx="8" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="52" y="365" font-size="11" fill="#777" font-weight="600">Изолированные хранилища (Database-per-Service)</text>
  <rect x="60" y="374" width="180" height="30" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="394" text-anchor="middle" font-size="12" font-weight="600">PG users_db</text>
  <rect x="260" y="374" width="180" height="30" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="394" text-anchor="middle" font-size="12" font-weight="600">PG core_db</text>
  <rect x="460" y="374" width="180" height="30" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="550" y="394" text-anchor="middle" font-size="12" font-weight="600">PG analytics_db</text>
  <rect x="660" y="374" width="180" height="30" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="750" y="394" text-anchor="middle" font-size="12" font-weight="600">PG ai_db</text>
</svg>
