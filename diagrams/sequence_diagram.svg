<svg viewBox="0 0 1060 440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, sans-serif">
  <defs><marker id="sa" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#333"/></marker>
  <marker id="sb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#999"/></marker></defs>
  <!-- Participants -->
  <rect x="5" y="2" width="100" height="28" rx="4" fill="#1a1a1a"/><text x="55" y="21" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Пользователь</text>
  <rect x="135" y="2" width="100" height="28" rx="4" fill="#1a1a1a"/><text x="185" y="21" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Tauri Client</text>
  <rect x="265" y="2" width="100" height="28" rx="4" fill="#1a1a1a"/><text x="315" y="21" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Nginx</text>
  <rect x="395" y="2" width="100" height="28" rx="4" fill="#1a1a1a"/><text x="445" y="21" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">AI Service</text>
  <rect x="545" y="2" width="110" height="28" rx="4" fill="#1a1a1a"/><text x="600" y="21" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">RabbitMQ #2</text>
  <rect x="695" y="2" width="110" height="28" rx="4" fill="#1a1a1a"/><text x="750" y="21" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Core RPC</text>
  <rect x="845" y="2" width="110" height="28" rx="4" fill="#1a1a1a"/><text x="900" y="21" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">PostgreSQL</text>
  <!-- Lifelines -->
  <line x1="55" y1="30" x2="55" y2="400" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="185" y1="30" x2="185" y2="400" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="315" y1="30" x2="315" y2="400" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="445" y1="30" x2="445" y2="400" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="600" y1="30" x2="600" y2="400" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="750" y1="30" x2="750" y2="400" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="900" y1="30" x2="900" y2="400" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- 1. User → Tauri -->
  <line x1="55" y1="55" x2="177" y2="55" stroke="#333" stroke-width="1.5" marker-end="url(#sa)"/>
  <text x="120" y="50" text-anchor="middle" font-size="10">«Добавь молоко»</text>
  <!-- 2. Tauri → Nginx -->
  <line x1="185" y1="75" x2="307" y2="75" stroke="#333" stroke-width="1.5" marker-end="url(#sa)"/>
  <text x="246" y="70" text-anchor="middle" font-size="10">POST /ai/chat (SSE)</text>
  <!-- 3. Nginx → AI -->
  <line x1="315" y1="95" x2="437" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#sa)"/>
  <text x="376" y="90" text-anchor="middle" font-size="10">proxy forward</text>
  <!-- Note: ReAct -->
  <rect x="410" y="108" width="200" height="18" rx="3" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="510" y="121" text-anchor="middle" font-size="9" font-style="italic" fill="#555">ReAct: Мысль → create_purchase_rpc</text>
  <!-- 4. AI → RabbitMQ -->
  <line x1="445" y1="140" x2="592" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#sa)"/>
  <text x="518" y="135" text-anchor="middle" font-size="9">publish(cmd, correlation_id, rpc=True)</text>
  <!-- Note: async -->
  <rect x="410" y="150" width="160" height="16" rx="3" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="490" y="162" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Поток НЕ заблокирован</text>
  <!-- 5. RMQ → Core -->
  <line x1="600" y1="180" x2="742" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#sa)"/>
  <text x="671" y="175" text-anchor="middle" font-size="10">consume(msg)</text>
  <!-- 6. Core → PG -->
  <line x1="750" y1="205" x2="892" y2="205" stroke="#333" stroke-width="1.5" marker-end="url(#sa)"/>
  <text x="821" y="200" text-anchor="middle" font-size="10">INSERT INTO purchases</text>
  <!-- 7. PG → Core (dashed return) -->
  <line x1="900" y1="230" x2="758" y2="230" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sb)"/>
  <text x="829" y="225" text-anchor="middle" font-size="10" fill="#666">OK (id=...)</text>
  <!-- 8. Core → RMQ (return) -->
  <line x1="750" y1="255" x2="608" y2="255" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sb)"/>
  <text x="679" y="250" text-anchor="middle" font-size="10" fill="#666">return {status: success}</text>
  <!-- 9. RMQ → AI (return by correlation_id) -->
  <line x1="600" y1="280" x2="453" y2="280" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sb)"/>
  <text x="527" y="275" text-anchor="middle" font-size="10" fill="#666">reply by correlation_id</text>
  <!-- Note: Observation -->
  <rect x="410" y="292" width="190" height="16" rx="3" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="505" y="304" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Наблюдение → формирует ответ</text>
  <!-- 10. AI → Tauri (SSE) -->
  <line x1="445" y1="322" x2="193" y2="322" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sb)"/>
  <text x="319" y="317" text-anchor="middle" font-size="10" fill="#666">SSE chunk: «Молоко добавлено ✓»</text>
  <!-- 11. Tauri → User -->
  <line x1="185" y1="345" x2="63" y2="345" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sb)"/>
  <text x="120" y="340" text-anchor="middle" font-size="10" fill="#666">Отображение в чате</text>
</svg>
